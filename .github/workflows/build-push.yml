name: Build and push base image

on:
  workflow_dispatch:
    inputs:
      rt_version:
        description: "Representative RT version for the tag (e.g. 6.0.3)"
        required: true
      distro:
        description: "Debian codename for the tag (e.g. bullseye)"
        required: true
        default: bullseye
      perl_version:
        description: "Perl version to build"
        required: true
        default: "5.34.3"
      cpanfile:
        description: "Override cpanfile URL (blank = Dockerfile default)"
        required: false
        default: ""
      use_cache:
        description: "Use registry build cache (faster debug re-runs; skips re-running tests on cached layers). Leave off for blessed builds."
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose image tag
        id: meta
        run: |
          DATE=$(date +%Y%m%d)
          TAG="RT-${{ inputs.rt_version }}-${{ inputs.distro }}-${DATE}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=bpssysadmin/rt-base-debian:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Composed image: bpssysadmin/rt-base-debian:${TAG}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Disable provenance/SBOM attestations: they turn a single-platform
          # push into an image index with an unknown/unknown entry, which
          # complicates the architecture verification below and is not needed.
          provenance: false
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            PERL_VERSION=${{ inputs.perl_version }}
            ${{ inputs.cpanfile && format('CPANFILE={0}', inputs.cpanfile) || '' }}
          cache-from: ${{ inputs.use_cache && 'type=registry,ref=bpssysadmin/rt-base-debian:buildcache' || '' }}
          cache-to: ${{ inputs.use_cache && 'type=registry,ref=bpssysadmin/rt-base-debian:buildcache,mode=max' || '' }}

      - name: Verify pushed image is linux/amd64
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          echo "Raw manifest metadata:"
          docker manifest inspect -v "$IMAGE"
          ARCH=$(docker manifest inspect -v "$IMAGE" \
            | jq -r '[.. | objects | .platform? // empty | .architecture]
                     | map(select(. != null and . != "unknown")) | unique | join(",")')
          echo "Architecture(s) in manifest: $ARCH"
          if [ "$ARCH" != "amd64" ]; then
            echo "::error::Expected linux/amd64 but manifest reports: '$ARCH'"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Pushed \`${{ steps.meta.outputs.image }}\`"
            echo ""
            echo "Architecture verified: **linux/amd64**"
            echo ""
            echo "**Next:** bump the \`FROM\` tag in RT's \`Dockerfile\` to"
            echo "\`${{ steps.meta.outputs.image }}\` to make this image live in RT's CI."
          } >> "$GITHUB_STEP_SUMMARY"
